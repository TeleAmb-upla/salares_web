# Salares Web — Huasco · visualización dron (estructura tipo fic_agro)
# =============================================================

shapefile_path: "data/shapefiles/aoi.geojson"
shapefile_id_col: "wetland_id"
shapefile_name_col: "nombre"

year_start: 2026
year_end: auto

wetlands:
  p1:
    name: "Sitio P1"
    aoi_source: &sitios "data/huasco/vector/sitios_huasco.gpkg"
    site_code: "P1"
  p2:
    name: "Sitio P2"
    aoi_source: *sitios
    site_code: "P2"
  p3:
    name: "Sitio P3"
    aoi_source: *sitios
    site_code: "P3"
  p4:
    name: "Sitio P4"
    aoi_source: *sitios
    site_code: "P4"
  p5:
    name: "Sitio P5"
    aoi_source: *sitios
    site_code: "P5"
  p6:
    name: "Sitio P6"
    aoi_source: *sitios
    site_code: "P6"
  p7:
    name: "Sitio P7 (H3)"
    aoi_source: *sitios
    site_code: "P7"

sources:
  drone:
    label: "Dron multiespectral"
    description: "Ortofotos e índices del vuelo en sitio P7 (H3)."
    input_root: "data/drone"
    legacy_input_roots: []
    static_root: "data_static/drone"
    enabled: true
    download_enabled: false
    color: "#c45c26"
    indices: ["rgb", "ndvi", "ndci", "ndwi", "lst"]
    flat_date_filenames: true

raster_visualization:
  preview_format: "WEBP"
  upscale_factor: 1
  preserve_pixels: true
  opacity: 0.92
  clip_to_aoi: true
  clip_aoi_buffer_m: 0
  rgb_webp_quality: 94
  webp_quality_analytic: 96
  index_preview_max_size: 6144
  rgb_max_size: 6144
  rgb_upscale_factor: 1
  rgb_quantize_colors: 128
  rgb_stretch_percentiles: [2, 98]
  rgb_context_buffer_m: 0
  rgb_leaflet_opacity: 1.0
  rgb_use_source_alpha_band: false
  rgb_hide_white_black_borders: true
  rgb_border_white_frac_of_max: 0.982
  rgb_border_black_frac_of_max: 0.02
  rgb_border_near_gray_spread_uint8: 42
  rgb_border_near_gray_mean_min_uint8: 226
  pause_between_drone_tiffs_sec: 0
  reuse_exported_webp_if_unchanged: true
  overwrite_preview_file: true

indices:
  ndvi:
    label: "NDVI"
    description: "Vigor de vegetación / biomasa"
    colormap: "YlGn"
    diverging: true
    vmin: -0.8
    vmax: 0.8
  ndci:
    label: "NDCI"
    description: "Clorofila y pigmentos"
    colormap: "viridis"
    diverging: true
    vmin: -0.5
    vmax: 0.5
  ndwi:
    label: "NDWI"
    description: "Agua superficial"
    colormap: "BrBG"
    diverging: true
    vmin: -0.4
    vmax: 0.4
  lst:
    label: "LST"
    description: "Temperatura superficial (°C)"
    colormap: "inferno"
    diverging: false
    vmin: 10
    vmax: 24
  rgb:
    label: "RGB"
    description: "Ortomosaico color verdadero"
    visual_only: true

seasons:
  vuelo: "Vuelo"

stats: []

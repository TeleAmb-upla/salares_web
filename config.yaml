# Salares Web — Huasco · visualización dron (estructura tipo fic_agro)
# =============================================================

shapefile_path: "data/shapefiles/aoi.geojson"
shapefile_id_col: "wetland_id"
shapefile_name_col: "nombre"

year_start: 2026
year_end: auto

wetlands:
  p1:
    name: "Sitio P1"
    aoi_source: &sitios "data/huasco/vector/sitios_huasco.gpkg"
    site_code: "P1"
  p2:
    name: "Sitio P2"
    aoi_source: *sitios
    site_code: "P2"
  p3:
    name: "Sitio P3"
    aoi_source: *sitios
    site_code: "P3"
  p4:
    name: "Sitio P4"
    aoi_source: *sitios
    site_code: "P4"
  p5:
    name: "Sitio P5"
    aoi_source: *sitios
    site_code: "P5"
  p6:
    name: "Sitio P6"
    aoi_source: *sitios
    site_code: "P6"
  p7:
    name: "Sitio P7 (H3)"
    aoi_source: *sitios
    site_code: "P7"

sources:
  drone:
    label: "Dron multiespectral"
    description: "Ortofotos e índices del vuelo en sitio P7 (H3)."
    input_root: "data/drone"
    legacy_input_roots: []
    static_root: "data_static/drone"
    enabled: true
    download_enabled: false
    color: "#c45c26"
    indices: ["rgb", "ndvi", "ndci", "ndwi", "lst"]
    flat_date_filenames: true

raster_visualization:
  preview_format: "WEBP"
  upscale_factor: 1
  preserve_pixels: true
  opacity: 0.92
  clip_to_aoi: true
  clip_aoi_buffer_m: 0
  rgb_webp_quality: 92
  webp_quality_analytic: 93
  index_preview_max_size: 5500
  rgb_max_size: 5500
  rgb_upscale_factor: 1
  rgb_quantize_colors: 128
  rgb_stretch_percentiles: [2, 98]
  rgb_context_buffer_m: 0
  rgb_leaflet_opacity: 1.0
  rgb_use_source_alpha_band: false
  rgb_hide_white_black_borders: true
  rgb_border_white_frac_of_max: 0.982
  rgb_border_black_frac_of_max: 0.02
  rgb_border_near_gray_spread_uint8: 42
  rgb_border_near_gray_mean_min_uint8: 226
  pause_between_drone_tiffs_sec: 0
  reuse_exported_webp_if_unchanged: true
  overwrite_preview_file: true

indices:
  ndvi:
    label: "NDVI"
    description: "El Índice de Vegetación de Diferencia Normalizada (NDVI) indica qué tan activa y cubierta de vegetación está una zona, comparando la luz reflejada en infrarrojo cercano y rojo visible. Valores altos (tonos verdes en el mapa) se asocian a mayor vigor y cobertura; valores bajos (tonos rojos) a suelo desnudo, salares o estrés. En el Salar de Huasco permite reconocer parches con biomasa microbiana o vascular frente a fondos salinos y áreas áridas del paisaje altoandino."
    colormap: "RdYlGn"
    diverging: true
    vmin: -0.8
    vmax: 0.8
  ndci:
    label: "NDCI"
    description: "El Índice de Contenido de Clorofila por Diferencia Normalizada (NDCI) está ligado a la cantidad de clorofila y otros pigmentos en la vegetación y en las comunidades algales del salar. Ayuda a detectar zonas con mayor actividad fotosintética o cambios en el estado fisiológico de las comunidades. Es útil para conversar sobre productividad biológica y posibles estrés ambientales en el humedal."
    colormap: "viridis"
    diverging: true
    vmin: -0.5
    vmax: 0.5
  ndwi:
    label: "NDWI"
    description: "El Índice de Agua por Diferencia Normalizada (NDWI) resalta la presencia de agua libre o muy húmeda en la superficie, contrastando el infrarrojo cercano con el verde. En un salar altoandino permite identificar charcas, zonas saturadas o humedales activos frente a suelos secos y costras salinas. Complementa la foto en color cuando el agua es poco visible a simple vista."
    colormap: "BrBG"
    diverging: true
    vmin: -0.4
    vmax: 0.4
  lst:
    label: "LST"
    description: "La Temperatura de Superficie (LST) estima cuántos grados Celsius tiene la superficie vista desde el dron, a partir del sensor térmico. Muestra contrastes entre agua, suelo, vegetación y costras salinas que no siempre se aprecian en la foto RGB. En el contexto del Anillo MESS ayuda a relacionar microclima local, evaporación y heterogeneidad del paisaje con los procesos biogeoquímicos del OE2."
    colormap: "inferno"
    diverging: false
    vmin: 10
    vmax: 24
  rgb:
    label: "RGB"
    description: "El ortomosaico en color verdadero (RGB) es la fotografía de alta resolución del vuelo de dron, como la veríamos a ojo humano desde el aire. Sirve de referencia para orientarse en el terreno, reconocer caminos, cuerpos de agua y texturas del salar. Es la base sobre la que se superponen los índices espectrales para comparar «lo que vemos» con «lo que mide el sensor»."
    visual_only: true

seasons:
  vuelo: "Vuelo"

stats: []
